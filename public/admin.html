<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Review | Campus Vault</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { padding: 32px 20px; max-width: 820px; margin: 0 auto; }
        .gate { display: flex; gap: 8px; margin: 20px 0 28px; flex-wrap: wrap; }
        .gate .form-control { max-width: 280px; }
        .admin-row { border: 1px solid var(--border, #2a2a33); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
        .admin-row h4 { margin: 2px 0 6px; }
        .admin-row .kind { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; opacity: .55; }
        .admin-row .meta { font-size: .8rem; opacity: .7; margin-bottom: 10px; word-break: break-all; }
        .admin-actions { display: flex; gap: 8px; }
        .empty { opacity: .55; padding: 48px 0; text-align: center; }
    </style>
</head>

<body>
    <h2>Admin Review Panel</h2>
    <p style="opacity:.7">Submissions stay hidden from the public site until approved here.</p>

    <div class="gate">
        <input type="password" id="pass" class="form-control" placeholder="Admin password" autocomplete="current-password">
        <button id="login-btn" class="btn primary-btn">Unlock</button>
        <button id="logout-btn" class="btn secondary-btn" style="display:none">Lock</button>
    </div>

    <div id="list"></div>
    <div id="toast-container" class="toast-container"></div>

    <script>
        const $ = s => document.querySelector(s);
        const list = $('#list');
        let pass = sessionStorage.getItem('adminPass') || '';

        const headers = () => ({ 'x-admin-pass': pass, 'Content-Type': 'application/json' });
        const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };

        function setLoggedIn(on) {
            $('#login-btn').style.display = on ? 'none' : '';
            $('#logout-btn').style.display = on ? '' : 'none';
            $('#pass').style.display = on ? 'none' : '';
        }

        async function load() {
            if (!pass) { list.innerHTML = ''; setLoggedIn(false); return; }
            const res = await fetch('/api/admin/pending', { headers: headers() });
            if (res.status === 401) { alert('Wrong password'); logout(); return; }
            const data = await res.json();
            setLoggedIn(true);
            render(data.pending || []);
        }

        function render(items) {
            if (!items.length) { list.innerHTML = '<div class="empty">Nothing pending review.</div>'; return; }
            list.innerHTML = items.map(it => `
                <div class="admin-row">
                    <div class="kind">${esc(it.kind)}${it.docType ? ' &middot; ' + esc(it.docType) : ''}${it.badge ? ' &middot; ' + esc(it.badge) : ''}</div>
                    <h4>${esc(it.title || it.label || '(untitled)')}</h4>
                    <div class="meta">${it.group ? 'Group: ' + esc(it.group) + '<br>' : ''}${it.href ? esc(it.href) + '<br>' : ''}${it.note ? esc(it.note) : ''}</div>
                    <div class="admin-actions">
                        <button class="btn primary-btn" data-act="approve" data-kind="${esc(it.kind)}" data-id="${esc(it.id)}">Approve</button>
                        <button class="btn secondary-btn" data-act="reject" data-kind="${esc(it.kind)}" data-id="${esc(it.id)}">Reject</button>
                    </div>
                </div>`).join('');
        }

        async function moderate(kind, id, action) {
            const res = await fetch('/api/admin/moderate', {
                method: 'POST', headers: headers(),
                body: JSON.stringify({ kind, id, action })
            });
            if (!res.ok) { alert('Action failed'); return; }
            load();
        }

        function logout() {
            pass = '';
            sessionStorage.removeItem('adminPass');
            $('#pass').value = '';
            list.innerHTML = '';
            setLoggedIn(false);
        }

        list.addEventListener('click', e => {
            const btn = e.target.closest('button[data-act]');
            if (btn) moderate(btn.dataset.kind, btn.dataset.id, btn.dataset.act);
        });
        $('#login-btn').onclick = () => {
            pass = $('#pass').value.trim();
            sessionStorage.setItem('adminPass', pass);
            load();
        };
        $('#logout-btn').onclick = logout;
        load();
    </script>
</body>

</html>
